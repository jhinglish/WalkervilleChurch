        if (roster) state.ros[doc.id] = roster;
      }
      state.loaded.rosters = true;
      void autoLock();
      redraw();
    });
    db.collection("away").onSnapshot((snap) => {
      state.away = {};
      for (const doc of snap.docs) state.away[doc.id] = parseAway(doc.data() ?? {});
      redraw();
    });
    db.collection("swaps").onSnapshot((snap) => {
      state.swaps = {};
      for (const doc of snap.docs) state.swaps[doc.id] = parseSwap(doc.id, doc.data() ?? {});
      redraw();
    });
    db.collection("logins").onSnapshot((snap) => {
      state.logins = {};
      for (const doc of snap.docs) {
        const login = parseLogin(doc.data());
        if (login) state.logins[doc.id] = login;
      }
      refreshLogins();
      resolveLogins();
      redraw();
    });
    db.collection("history").orderBy("ts", "desc").limit(200).onSnapshot((snap) => {
      state.log = snap.docs.map((doc) => parseHistory(doc.data() ?? {}));
      void resolveNames();
      redraw();
    });
    return true;
  }
  async function resolveNames() {
    const ids = [...new Set(state.log.map((h) => h.by).filter(Boolean))];
    try {
      const profiles = await state.user?.profiles(ids);
      for (const id of ids) state.names[id] = profiles?.[id]?.name || "";
    } catch {
    }
  }

  // src/handlers.ts
  var TABS = ["m", "w", "s", "r", "a", "v", "p", "h"];
  var isTab = (v) => TABS.includes(v);
  function confirmed(key) {
    if (state.cf === key) {
      state.cf = null;
      return true;
    }
    state.cf = key;
    return false;
  }
  async function moveIfAllowed(date, id, from, to) {
    if (!canMoveBetween(from, to)) {
      state.sel = null;
      flash("Your role cannot change that ministry.");
      return;
    }
    await move(date, id, from, to);
  }
  async function onClick(e) {
    const t = e.target;
    if (!(t instanceof HTMLElement)) return;
    if (t.closest("input,textarea,select,label")) return;
    const chip = t.closest(".chip");
    const drop = t.closest("[data-drop]");
    const ds = t.dataset;
    let skipRender = false;
    try {
      if (ds["t"]) {
        if (isTab(ds["t"])) state.tab = ds["t"];
        document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b === t));
      } else if (t.id === "gen") await genMissing();
      else if (t.id === "past") state.past = !state.past;
      else if (t.id === "csv") exportCsv();
      else if (ds["regen"]) {
        if (confirmed(ds["regen"])) await regen(ds["regen"]);
      } else if (t.id === "aadd") {
        const from = valueOf("af");
        const to = valueOf("at") || from;
        if (from && to >= from) await addAway(valueOf("ap"), from, to, valueOf("an"));
      } else if (ds["del"]) await removeAway(ds["del"]);
      else if (t.id === "sedit") state.sedit = !state.sedit;
      else if (t.id === "pdf") await exportPdf(ds["d"] ?? "");
      else if (ds["srm"]) {
        const [key = "", ...id] = ds["srm"].split("|");
        await moveIfAllowed(ds["d"] ?? "", id.join("|"), key, "");
      } else if (ds["sadd"]) {
        const id = valueOf(`sa-${ds["sadd"]}`);
        if (id) await moveIfAllowed(ds["d"] ?? "", id, "", ds["sadd"]);
      } else if (ds["vsave"]) await saveVerse(ds["vsave"]);
      else if (ds["nsave"]) await saveNote(ds["nsave"]);
      else if (t.closest("[data-fl]")) {
        const date = t.closest("[data-fl]")?.dataset["fl"] ?? "";
        state.fd = state.fd === date ? "" : date;
      } else if (t.closest("[data-pick]")) {
        const id = t.closest("[data-pick]")?.dataset["pick"] ?? "";
        state.pick = state.pick === id ? "" : id;
      } else if (t.id === "padd") {
        const name = valueOf("pn").trim();
        if (name) await addPerson(name, Number(valueOf("pf")) || 0);
      } else if (ds["prm"]) {
        if (confirmed(`p:${ds["prm"]}`)) await setPersonRemoved(ds["prm"], true);
      } else if (ds["prs"]) await setPersonRemoved(ds["prs"], false);
      else if (t.id === "madd") {
        const name = valueOf("mn").trim();
        if (name) await addMinistry(name, Math.max(0, Number(valueOf("mc")) || 1), isChecked("mx"), valueOf("ml"));
      } else if (ds["mrm"]) {
        if (confirmed(`m:${ds["mrm"]}`)) await setMinistryRemoved(ds["mrm"], true);
      } else if (ds["mrs"]) await setMinistryRemoved(ds["mrs"], false);
      else if (ds["swapfor"]) {
        state.swapDraft = ds["swapfor"];
        state.tab = "w";
      } else if (t.id === "swreq") {
        const [date = "", ministry = ""] = valueOf("swslot").split("|");
        const error = await requestSwap(date, ministry, valueOf("swnote"));
        if (error) {
          flash(error);
          skipRender = true;
        } else {
          state.swapDraft = "";
          flash("Swap requested. A team leader will review it.");
        }
      } else if (ds["swcancel"]) {
        const error = await cancelSwap(ds["swcancel"]);
        if (error) flash(error);
      } else if (ds["swok"] || ds["swno"]) {
        const id = ds["swok"] ?? ds["swno"] ?? "";
        const error = await decideSwap(id, ds["swok"] ? "approved" : "declined", valueOf(`swc-${id}`));
        if (error) flash(error);
      } else if (t.id === "ics") exportMyIcs();
      else if (t.id === "pwsave") {
        const next = valueOf("pw-new");
        const error = next !== valueOf("pw-new2") ? "The new passwords do not match." : await changeOwnPassword(valueOf("pw-cur"), next);
        flash(error ?? "Password changed.");
        skipRender = error !== null;
      } else if (t.id === "ladd") {
        const error = await createLogin(valueOf("lperson"), valueOf("lname"), valueOf("lpass"));
        flash(error ?? "Login created.");
        skipRender = error !== null;
      } else if (ds["lreset"]) {
        const error = await resetLogin(ds["lreset"], valueOf(`lp-${ds["lreset"]}`));
        flash(error ?? "Password reset.");
        skipRender = error !== null;
      } else if (ds["lrm"]) {
        if (confirmed(`l:${ds["lrm"]}`)) await removeLogin(ds["lrm"]);
      } else if (chip) {
        const next = { id: chip.dataset["id"] ?? "", d: chip.dataset["d"] ?? "", k: chip.dataset["k"] ?? "" };
        const cur = state.sel;
        state.sel = cur && cur.id === next.id && cur.d === next.d && cur.k === next.k ? null : next;
      } else if (drop && state.sel && state.sel.d === drop.dataset["d"]) {
        await moveIfAllowed(state.sel.d, state.sel.id, state.sel.k, drop.dataset["drop"] ?? "");
      }
    } catch (error) {
      fail(error);
    }
    if (!skipRender) render();
  }
  async function onChange(e) {
    const t = e.target;
    if (!(t instanceof HTMLInputElement || t instanceof HTMLSelectElement || t instanceof HTMLTextAreaElement)) return;
    const d = t.dataset;
    if (t.id === "thr") {
      state.thr = Math.max(0, Number(t.value) || 0);
      render();
    }
    if (t.id === "nsel") {
      state.nd = t.value;
      render();
    }
    const checked = t instanceof HTMLInputElement && t.checked;
    try {
      const person = d["pid"] ?? "";
      if (d["pf"] === "name" && t.value.trim()) await renamePerson(person, t.value.trim());
      else if (d["pf"] === "fam") await setFamily(person, Number(t.value) || 0);
      else if (d["pe"]) await setEligibility(person, d["pe"], checked);
      else if (d["prole"]) await setRole(person, t.value);
      else if (d["plead"]) await setLeads(person, d["plead"], checked);
      else if (d["prof"]) await updateOwnProfile(d["prof"], t.value);
      else if (d["mf"] === "l" || d["mf"] === "n" || d["mf"] === "x") {
        await updateMinistry(d["mk"] ?? "", d["mf"], t.value, checked);
      }
    } catch (error) {
      fail(error);
    }
  }
  function onInput(e) {
    const t = e.target;
    if (!(t instanceof HTMLTextAreaElement)) return;
    if (t.dataset["note"]) state.drafts[t.dataset["note"]] = t.value;
    if (t.dataset["verse"]) state.drafts[`v${t.dataset["verse"]}`] = t.value;
  }
  var chipOf = (e) => e.target instanceof Element ? e.target.closest(".chip") : null;
  var dropOf = (e) => e.target instanceof Element ? e.target.closest("[data-drop]") : null;
  function bindEvents() {
    document.addEventListener("click", (e) => void onClick(e));
    document.addEventListener("change", (e) => void onChange(e));
    document.addEventListener("input", onInput);
    document.addEventListener("dragstart", (e) => {
      const c = chipOf(e);
      if (c) state.sel = { id: c.dataset["id"] ?? "", d: c.dataset["d"] ?? "", k: c.dataset["k"] ?? "" };
    });
    document.addEventListener("dragover", (e) => {
      if (dropOf(e)) e.preventDefault();
    });
    document.addEventListener("drop", (e) => {
      const target = dropOf(e);
      const sel = state.sel;
      if (!target || !sel || sel.d !== target.dataset["d"]) return;
      e.preventDefault();
      moveIfAllowed(sel.d, sel.id, sel.k, target.dataset["drop"] ?? "").catch(fail);
    });
  }

  // src/login.ts
  var EXPIRY_CHECK_MS = 6e4;
  var LOGIN_ERRORS = {
    missing: "Enter your username and password.",
    invalid: "Incorrect username or password.",
    unavailable: "Sign-in is not available in this browser context. Open the page over HTTPS.",
    expired: "Your session has expired. Please sign in again."
  };
  function lockedMessage(until) {
    const minutes = Math.max(1, Math.ceil((until - Date.now()) / 6e4));
    return `Too many failed attempts. Try again in ${minutes} minute${minutes === 1 ? "" : "s"}.`;
  }
  function input(id) {
    const el = document.getElementById(id);
    return el instanceof HTMLInputElement ? el : null;
  }
  function setError(message) {
    const el = document.getElementById("login-error");
    if (el) el.textContent = message;
  }
  function setBusy(busy) {
    const button = document.getElementById("login-submit");
    if (button instanceof HTMLButtonElement) button.disabled = busy;
  }
  function showLogin(message = "") {
    const login = document.getElementById("login");
    const app = document.getElementById("app");
    if (app) app.hidden = true;
    if (login) login.hidden = false;
    const password = input("login-password");
    if (password) password.value = "";
    setError(message);
    input("login-username")?.focus();
  }
  function showApp(user) {
    const login = document.getElementById("login");
    const app = document.getElementById("app");
    const who = document.getElementById("who");
    if (who) who.textContent = `${user.displayName} \xB7 ${ROLE_DEFINITIONS[user.role].label}`;
    if (login) login.hidden = true;
    if (app) app.hidden = false;
    setError("");
  }
  function enter(user, hooks) {
    showApp(user);
    hooks.onSignedIn(user);
  }
  async function submit(hooks) {
    const username = input("login-username");
    const password = input("login-password");
    if (!username || !password) return;
    setError("");
    if (!username.value.trim() || !password.value) {
      setError(LOGIN_ERRORS.missing);
      return;
    }
    setBusy(true);
    try {
      await hooks.whenReady?.();
      const result = await signIn(username.value, password.value);
      if (result.ok) {
        username.value = "";
        password.value = "";
        enter(result.user, hooks);
      } else {
        password.value = "";
        password.focus();
        setError(result.reason === "locked" ? lockedMessage(result.until) : LOGIN_ERRORS[result.reason]);
      }
    } finally {
      setBusy(false);
    }
  }
  function initLogin(hooks) {
    const form = document.getElementById("login-form");
    if (!(form instanceof HTMLFormElement)) throw new Error("The sign-in form is missing from the page");
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      void submit(hooks);
    });
    document.getElementById("signout")?.addEventListener("click", () => {
      signOut();
      showLogin();
      hooks.onSignedOut();
    });
    window.setInterval(() => {
      const app = document.getElementById("app");
      if (app && !app.hidden && !currentUser()) {
        showLogin(LOGIN_ERRORS.expired);
        hooks.onSignedOut();
      }
    }, EXPIRY_CHECK_MS);
    void (async () => {
      await hooks.whenReady?.();
      const saved = restoreSession();
      if (saved) enter(saved, hooks);
      else showLogin();
    })();
  }

  // src/main.ts
  bindEvents();
  var connection = connect(render);
  var LOGINS_WAIT_MS = 3e3;
  var whenReady = () => Promise.race([
    connection.then(() => loginsReady),
    new Promise((resolve) => {
      setTimeout(resolve, LOGINS_WAIT_MS);
    })
  ]);
  async function start() {
    if (await connection) {
      render();
      void autoLock();
      return;
    }
    const view = $("#v");
    if (view) view.innerHTML = '<p class="mut">Sign in to claude.ai to use the roster.</p>';
  }
  initLogin({
    whenReady,
    onSignedIn: () => {
      state.tab = "m";
      state.sel = null;
      state.cf = null;
      state.sedit = false;
      state.swapDraft = "";
      syncNav();
      void start();
    },
    onSignedOut: () => {
      const view = $("#v");
      if (view) view.innerHTML = "";
    }
  });
})();
</script>
</body></html>
