<!DOCTYPE html>

<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

</style></head><body><main>
<h1>Walkerville Sunday Roster</h1>
<div class="mut">Tap a name, then tap the ministry box to move them (dragging works too). Drop on “Not serving” to remove. Red = conflict.</div>

<script>
"use strict";
(() => {
  // src/dom.ts
  var ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, (c) => ESCAPES[c] ?? c);
  }
  function $(selector) {
    return document.querySelector(selector);
  }
  function valueOf(id) {
    const el = document.getElementById(id);
    return el instanceof HTMLInputElement || el instanceof HTMLSelectElement || el instanceof HTMLTextAreaElement ? el.value : "";
  }
  function isChecked(id) {

  var flashTimer;

  // src/dates.ts

  }

    const last = end.toISOString().slice(0, 10);

    for (let d = start; d <= last; d = addDays(d, 7)) sundays.push(d);
    return sundays;
  }
  function formatDate(date) {

      day: "numeric",

  }

  // src/model.ts
  function allMinistries(config) {

  }
  function activeMinistries(config) {
    return allMinistries(config).filter((m) => !m.gone);
  }
  function isAway(away, id, date) {
    return away.some((a) => a.person === id && a.from <= date && date <= a.to);
  }
  function ministriesForSunday(config, roster) {
    if (!roster) return activeMinistries(config);
    const count = (k) => (roster.s[k] ?? []).length;
    const base = roster.meta?.m ? roster.meta.m.map((m) => ({ ...m })) : allMinistries(config).filter((m) => !m.gone || count(m.k) > 0).map((m) => ({ ...m }));
    for (const k of Object.keys(roster.s)) {
      if (!base.some((m) => m.k === k) && count(k) > 0) {

  function takeSnapshot(config, people, roster) {

  // src/generate.ts
  function generateAssignments(input) {

          (p) => p.elig.includes(m.k) && !isAway(away, p.id, date) && !slot.includes(p.id) && !inExclusive.has(p.id)

        const fresh = pool.filter((p) => !used.has(p.id));
        pool = m.x ? fresh : fresh.length ? fresh : pool;
        if (pool.length === 0) break;
        const score = (p) => (lastIndex.get(m.k + p.id) ?? -99) - (candidates.some((q) => q.family === p.family && used.has(q.id)) ? 1.5 : 0) + (timesServed.get(p.id) ?? 0) * 0.01;

        const chosen = pool[0];
        if (!chosen) break;
        slot.push(chosen.id);
        used.add(chosen.id);
        if (m.x) inExclusive.add(chosen.id);
      }
    }
    return assignments;
  }

  // src/issues.ts
  function findIssues(roster, config, people, away) {
    const ministries = ministriesForSunday(config, roster);
    const out = {};
    const sum = [];
    const placedIn = {};
    const add = (id, text2) => {
      (out[id] ??= []).push(text2);
    };
    for (const m of ministries) {

  }

  var tabId = `t${Math.random().toString(36).slice(2)}`;

  // src/selectors.ts

  var allMinistriesNow = () => allMinistries(state.cfg);

  }

  }

    date,
    ministries: activeMinistries(state.cfg),
    people: peopleList(),

  // src/exports.ts
  async function exportPdf(date) {
    const JsPdf = window.jspdf?.jsPDF;

    const pdf = new JsPdf();
    const roster = rosterAt(date);

    if (roster.verse) {
      pdf.setFontSize(12);

    });

      const current = await ref.get();
      if (!current.exists) return;
      const ministries = parseMinistries(current.data()?.["ministries"]);
      change(ministries);
      await ref.update({ ministries });
    });
  }
  async function addMinistry(name, headcount, exclusive) {
    await saveMinistries(
      (ms) => ms.push({ k: `m${Date.now().toString(36)}`, l: name, n: Math.max(0, headcount), x: exclusive ? 1 : 0 })
    );
    logit(`Added ministry: ${name}`);
  }
  async function setMinistryRemoved(key, removed) {
    await saveMinistries((ms) => {
      const m = ms.find((x) => x.k === key);
      if (m) m.gone = removed;
    });
    logit(`${removed ? "Removed" : "Restored"} ministry: ${allMinistriesNow().find((m) => m.k === key)?.l ?? key}`);
  }
  async function updateMinistry(key, field, value, checked) {
    await saveMinistries((ms) => {
      const m = ms.find((x) => x.k === key);
      if (!m) return;
      if (field === "l" && value.trim()) m.l = value.trim();
      if (field === "n") m.n = Math.max(0, Number(value) || 0);
      if (field === "x") m.x = checked ? 1 : 0;
    });
    logit(`Updated ministry settings: ${field === "l" ? value : allMinistriesNow().find((m) => m.k === key)?.l}`);
  }
  async function addPerson(name, family) {
    let id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "person";
    for (let attempt = 0; attempt < 50; attempt++, id += "-2") {
      const created = await withLock(requireDb().doc(`people/${id}`), async (ref) => {
        if ((await ref.get()).exists) return false;
        await ref.set({ name, family, elig: [] });
        return true;
      });
      if (created) {
        logit(`Added person: ${name}`);
        return;
      }
    }
    throw new Error("Could not find a free id for this person");
  }
  var personLabel = (id) => state.people[id]?.name ?? id;
  async function setPersonRemoved(id, removed) {
    await requireDb().doc(`people/${id}`).update({ gone: removed });
    logit(`${removed ? "Removed" : "Restored"} person: ${personLabel(id)}`);
  }
  async function renamePerson(id, name) {
    const before = personLabel(id);
    await requireDb().doc(`people/${id}`).update({ name });
    logit(`Renamed ${before} to ${name}`);
  }
  async function setFamily(id, family) {
    await requireDb().doc(`people/${id}`).update({ family });
    logit(`Family number for ${personLabel(id)} set to ${family}`);
  }
  async function setEligibility(id, key, eligible) {
    await withLock(requireDb().doc(`people/${id}`), async (ref) => {
      const current = await ref.get();
      if (!current.exists) return;
      const list = parsePerson(id, current.data() ?? {}).elig;
      const elig = eligible ? list.includes(key) ? list : [...list, key] : list.filter((k) => k !== key);
      await ref.update({ elig });
    });
    logit(
      `${personLabel(id)}${eligible ? " can now serve in " : " can no longer serve in "}${allMinistriesNow().find((m) => m.k === key)?.l || key}`
    );
  }
  async function addAway(person, from, to, note) {
    await requireDb().collection("away").add({ person, from, to, note });
    logit(`Away: ${personLabel(person)} ${from}${to !== from ? ` to ${to}` : ""}`);
  }
  async function removeAway(key) {
    await requireDb().doc(`away/${key}`).delete();
    logit("Removed an away entry");
  }
  var locking = false;
  var lockStop = false;
  async function autoLock() {
    const { db, user, cfg, loaded } = state;
    if (locking || lockStop || !(loaded.config && loaded.people && loaded.rosters) || !cfg || !db) return;
    const todo = Object.keys(state.ros).filter((d) => !state.ros[d]?.meta);
    if (todo.length === 0) return;
    locking = true;
    try {
      if (user && await user.can("data.write") === false) {
        lockStop = true;
        return;
      }
      let locked = 0;
      for (const date of todo) {
        await withLock(db.doc(`rosters/${date}`), async (ref) => {
          const current = await ref.get();
          const roster = current.exists ? parseRoster(date, current.data()) : null;
          if (roster && !roster.meta) {
            await ref.update({ meta: snapshotNow(roster) });
            locked++;
          }
        });
      }
      if (locked > 0) logit(`Locked ${locked} existing Sunday(s) to their current ministry and people settings`);
    } catch (error) {
      lockStop = true;
      console.error(error);
    } finally {
      locking = false;
    }
  }
  async function connect(onChange2) {
    try {
      const [db2, user, downloads] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
      state.db = db2;
      state.user = user;
      state.downloads = downloads;
    } catch {
    }
    const db = state.db;
    if (!db) return false;
    try {
      state.me = await state.user?.id() ?? "";
    } catch {
    }
    const redraw = () => {
      state.ready = true;
      onChange2();
    };
    db.doc("config/main").onSnapshot((snap) => {
      state.cfg = snap.exists ? parseConfig(snap.data()) : null;
      state.loaded.config = true;
      redraw();
      void autoLock();
    });
    db.collection("people").onSnapshot((snap) => {
      state.people = {};
      for (const doc of snap.docs) state.people[doc.id] = parsePerson(doc.id, doc.data() ?? {});
      state.loaded.people = true;
      void autoLock();
      redraw();
    });
    db.collection("rosters").onSnapshot((snap) => {
      state.ros = {};
      for (const doc of snap.docs) {
        const roster = parseRoster(doc.id, doc.data());
        if (roster) state.ros[doc.id] = roster;
      }
      state.loaded.rosters = true;
      void autoLock();
      redraw();
    });
    db.collection("away").onSnapshot((snap) => {
      state.away = {};
      for (const doc of snap.docs) state.away[doc.id] = parseAway(doc.data() ?? {});
      redraw();
    });
    db.collection("history").orderBy("ts", "desc").limit(200).onSnapshot((snap) => {
      state.log = snap.docs.map((doc) => parseHistory(doc.data() ?? {}));
      void resolveNames();
      redraw();
    });
    return true;
  }
  async function resolveNames() {
    const ids = [...new Set(state.log.map((h) => h.by).filter(Boolean))];
    try {
      const profiles = await state.user?.profiles(ids);
      for (const id of ids) state.names[id] = profiles?.[id]?.name || "";
    } catch {
    }
  }

  // src/handlers.ts
  var TABS = ["s", "r", "a", "v", "h"];
  var isTab = (v) => TABS.includes(v);
  function confirmed(key) {
    if (state.cf === key) {
      state.cf = null;
      return true;
    }
    state.cf = key;
    return false;
  }
  async function onClick(e) {
    const t = e.target;
    if (!(t instanceof HTMLElement)) return;
    if (t.closest("input,textarea,select,label")) return;
    const chip = t.closest(".chip");
    const drop = t.closest("[data-drop]");
    const ds = t.dataset;
    try {
      if (ds["t"]) {
        if (isTab(ds["t"])) state.tab = ds["t"];
        document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b === t));
      } else if (t.id === "gen") await genMissing();
      else if (t.id === "past") state.past = !state.past;
      else if (t.id === "csv") exportCsv();
      else if (ds["regen"]) {
        if (confirmed(ds["regen"])) await regen(ds["regen"]);
      } else if (t.id === "aadd") {
        const from = valueOf("af");
        const to = valueOf("at") || from;
        if (from && to >= from) await addAway(valueOf("ap"), from, to, valueOf("an"));
      } else if (ds["del"]) await removeAway(ds["del"]);
      else if (t.id === "sedit") state.sedit = !state.sedit;
      else if (t.id === "pdf") await exportPdf(ds["d"] ?? "");
      else if (ds["srm"]) {
        const [key = "", ...id] = ds["srm"].split("|");
        await move(ds["d"] ?? "", id.join("|"), key, "");
      } else if (ds["sadd"]) {
        const id = valueOf(`sa-${ds["sadd"]}`);
        if (id) await move(ds["d"] ?? "", id, "", ds["sadd"]);
      } else if (ds["vsave"]) await saveVerse(ds["vsave"]);
      else if (ds["nsave"]) await saveNote(ds["nsave"]);
      else if (t.closest("[data-fl]")) {
        const date = t.closest("[data-fl]")?.dataset["fl"] ?? "";
        state.fd = state.fd === date ? "" : date;
      } else if (t.closest("[data-pick]")) {
        const id = t.closest("[data-pick]")?.dataset["pick"] ?? "";
        state.pick = state.pick === id ? "" : id;
      } else if (t.id === "padd") {
        const name = valueOf("pn").trim();
        if (name) await addPerson(name, Number(valueOf("pf")) || 0);
      } else if (ds["prm"]) {
        if (confirmed(`p:${ds["prm"]}`)) await setPersonRemoved(ds["prm"], true);
      } else if (ds["prs"]) await setPersonRemoved(ds["prs"], false);
      else if (t.id === "madd") {
        const name = valueOf("mn").trim();
        if (name) await addMinistry(name, Math.max(0, Number(valueOf("mc")) || 1), isChecked("mx"));
      } else if (ds["mrm"]) {
        if (confirmed(`m:${ds["mrm"]}`)) await setMinistryRemoved(ds["mrm"], true);
      } else if (ds["mrs"]) await setMinistryRemoved(ds["mrs"], false);
      else if (chip) {
        const next = { id: chip.dataset["id"] ?? "", d: chip.dataset["d"] ?? "", k: chip.dataset["k"] ?? "" };
        const cur = state.sel;
        state.sel = cur && cur.id === next.id && cur.d === next.d && cur.k === next.k ? null : next;
      } else if (drop && state.sel && state.sel.d === drop.dataset["d"]) {
        await move(state.sel.d, state.sel.id, state.sel.k, drop.dataset["drop"] ?? "");
      }
    } catch (error) {
      fail(error);
    }
    render();
  }
  async function onChange(e) {
    const t = e.target;
    if (!(t instanceof HTMLInputElement || t instanceof HTMLSelectElement || t instanceof HTMLTextAreaElement)) return;
    const d = t.dataset;
    if (t.id === "thr") {
      state.thr = Math.max(0, Number(t.value) || 0);
      render();
    }
    if (t.id === "nsel") {
      state.nd = t.value;
      render();
    }
    const checked = t instanceof HTMLInputElement && t.checked;
    try {
      const person = d["pid"] ?? "";
      if (d["pf"] === "name" && t.value.trim()) await renamePerson(person, t.value.trim());
      else if (d["pf"] === "fam") await setFamily(person, Number(t.value) || 0);
      else if (d["pe"]) await setEligibility(person, d["pe"], checked);
      else if (d["mf"] === "l" || d["mf"] === "n" || d["mf"] === "x") {
        await updateMinistry(d["mk"] ?? "", d["mf"], t.value, checked);
      }
    } catch (error) {
      fail(error);
    }
  }
  function onInput(e) {
    const t = e.target;
    if (!(t instanceof HTMLTextAreaElement)) return;
    if (t.dataset["note"]) state.drafts[t.dataset["note"]] = t.value;
    if (t.dataset["verse"]) state.drafts[`v${t.dataset["verse"]}`] = t.value;
  }
  var chipOf = (e) => e.target instanceof Element ? e.target.closest(".chip") : null;
  var dropOf = (e) => e.target instanceof Element ? e.target.closest("[data-drop]") : null;
  function bindEvents() {
    document.addEventListener("click", (e) => void onClick(e));
    document.addEventListener("change", (e) => void onChange(e));
    document.addEventListener("input", onInput);
    document.addEventListener("dragstart", (e) => {
      const c = chipOf(e);
      if (c) state.sel = { id: c.dataset["id"] ?? "", d: c.dataset["d"] ?? "", k: c.dataset["k"] ?? "" };
    });
    document.addEventListener("dragover", (e) => {
      if (dropOf(e)) e.preventDefault();
    });
    document.addEventListener("drop", (e) => {
      const target = dropOf(e);
      const sel = state.sel;
      if (!target || !sel || sel.d !== target.dataset["d"]) return;
      e.preventDefault();
      move(sel.d, sel.id, sel.k, target.dataset["drop"] ?? "").catch(fail);
    });
  }

  // src/main.ts
  bindEvents();
  void (async () => {
    const connected = await connect(render);
    if (!connected) {
      const view = $("#v");
      if (view) view.innerHTML = '<p class="mut">Sign in to claude.ai to use the roster.</p>';
    }
  })();
})();
</script>
</body></html>
